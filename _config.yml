# Site Settings
locale                   : "en-US"
title                    : Charlie Pearson
title_separator          : "-"
subtitle                 :
name                     : Charlie Pearson
description              : Charlie Pearson - Mechanical Engineering Portfolio
baseurl                  : "" # Leave this empty - your repo is username.github.io
url                      : "https://CPearson03.github.io"

# Theme and Style
theme: jekyll-theme-minimal
color_scheme: light

sass:
  style: compressed

# Outputting
permalink: /:categories/:title/
collections:
  pages:
    output: true
  projects:
    output: true
    permalink: /:collection/:path/

# Markdown
markdown: kramdown
kramdown:
  input: GFM

# Plugins
plugins:
  - jekyll-feed
  - jekyll-include-cache
  - jekyll-seo-tag